name: Continuous Deployment to Dev Env
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy Code onto EC2 via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DEV_EC2_IP }}
        username: ubuntu
        key: ${{ secrets.DEV_EC2_SSH_KEY }}
        script: |
          cd /home/ubuntu/llmops-rag-project
          if [ ! -d ".git" ]; then
            git clone https://github.com{{ github.repository }}.git .
          else
            git pull origin main
          fi
          
          sudo docker-compose up -d opensearch
          
          python3 -m venv venv
          ./venv/bin/pip install -r requirements.txt
          
          pkill uvicorn || true
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export LANGCHAIN_API_KEY="${{ secrets.LANGCHAIN_API_KEY }}"
          export OPENSEARCH_URL="http://localhost:9200"
          export ENV_NAME="production-dev-env"
          
          nohup ./venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 > app.log 2>&1 &
